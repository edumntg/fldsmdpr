<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLDSMDPR</title>
    <script>
      // Apply persisted/system theme before first paint to avoid a flash.
      try {
        const saved = localStorage.getItem("kv:theme");
        const dark =
          saved === "dark" ||
          ((!saved || saved === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
        const d = document.documentElement.dataset;
        d.theme = dark ? "dark" : "light";
        d.accent = localStorage.getItem("ui:accent") || "blue";
        d.density = localStorage.getItem("ui:density") || "comfortable";
        if ("__TAURI_INTERNALS__" in window) d.tauri = "1";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
